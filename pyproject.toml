[project]
name = "atv2-testes-unitarios"
version = "0.1.0"
description = "Classificação de idade para Neon Genesis Evangelion - QTS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "pydantic>=2.10.0",
    "httpx2>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-playwright>=0.5.0",
    "playwright>=1.48.0",
    "axe-playwright-python>=0.1.4",
    "faker>=30.0.0",
    "locust>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "unit: testes unitários",
    "integration: testes de integração",
    "e2e: testes ponta a ponta",
    "accessibility: testes de acessibilidade",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
