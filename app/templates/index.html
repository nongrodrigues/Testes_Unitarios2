<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Classificador EVA</title>
</head>
<body>
    <main>
        <h1>Classificador de Maturação EVA</h1>
        
        <form id="eva-form">
            <div>
                <label for="n1">Nota 1</label>
                <input type="number" id="n1" step="0.1" required>
            </div>
            <div>
                <label for="n2">Nota 2</label>
                <input type="number" id="n2" step="0.1" required>
            </div>
            <div>
                <label for="n3">Nota 3</label>
                <input type="number" id="n3" step="0.1" required>
            </div>
            <div>
                <label for="idade">Idade</label>
                <input type="number" id="idade" required>
            </div>
            <button type="button" id="btn-calcular">Calcular Classificação</button>
        </form>
        
        <div id="resultado" role="status" style="margin-top: 20px; font-weight: bold;"></div>
    </main>

    <script>
        document.getElementById('btn-calcular').addEventListener('click', async () => {
            const n1 = parseFloat(document.getElementById('n1').value);
            const n2 = parseFloat(document.getElementById('n2').value);
            const n3 = parseFloat(document.getElementById('n3').value);
            const idade = parseInt(document.getElementById('idade').value);

            const res = await fetch('/api/classificar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({n1, n2, n3, idade})
            });
            
            if (res.ok) {
                const data = await res.json();
                document.getElementById('resultado').innerText = `${data.acesso} | ${data.permissao_idade}`;
            } else {
                document.getElementById('resultado').innerText = "Erro ao calcular.";
            }
        });
    </script>
</body>
</html>
